<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuBMAP — órgãos de referência</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; color: #111827; font: 13px/1.4 Inter, system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 240px 1fr; height: 100%; overflow: hidden; }
  #app > * { min-width: 0; min-height: 0; }
  aside { border-right: 1px solid #e5e7eb; padding: 14px; overflow: auto; }
  aside h2 { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #6b7280; margin: 0 0 8px; }
  label.o { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 6px; cursor: pointer; }
  label.o:hover { background: #f3f4f6; }
  label.o input { accent-color: #111827; }
  label.o .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  label.o .st { margin-left: auto; font-size: 11px; color: #9ca3af; }
  #canvas { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #tip { position: absolute; left: 12px; bottom: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 12px; font-size: 13px; max-width: 70%; }
  #tip b { font-weight: 600; }
  #tip small { color: #6b7280; display: block; }
  .cred { font-size: 11px; color: #6b7280; margin-top: 14px; line-height: 1.4; }
  .btns { display: flex; gap: 6px; margin-bottom: 10px; }
  .btns button { flex: 1; padding: 6px; border: 1px solid #e5e7eb; background: #fff; border-radius: 6px; font: inherit; cursor: pointer; }
  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr 180px; }
    aside { border-right: 0; border-top: 1px solid #e5e7eb; order: 2; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside>
    <div class="btns"><button id="all">Todos</button><button id="none">Nenhum</button><button id="reset">Câmera</button></div>
    <h2>Órgãos (masculino)</h2>
    <div id="list"></div>
    <div class="cred">Modelos: HuBMAP Human Reference Atlas v1.2, CC BY 4.0. Visualizador: ENTROLABS.</div>
  </aside>
  <div id="canvas">
    <canvas id="c"></canvas>
    <div id="tip"><b>Clique em um órgão</b><small>arraste para girar, roda do mouse para aproximar</small></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const BASE = 'https://raw.githubusercontent.com/hubmapconsortium/ccf-releases/main/v1.2/models/';
const ORGANS = [
  { f: 'VH_M_Skin', n: 'Pele', c: '#e7c9b3', on: true, alpha: 0.18 },
  { f: 'Allen_M_Brain', n: 'Cérebro', c: '#c4b5fd', on: true },
  { f: 'VH_M_Spinal_Cord', n: 'Medula espinhal', c: '#a78bfa', on: true },
  { f: 'VH_M_Heart', n: 'Coração', c: '#ef4444', on: true },
  { f: 'VH_M_Lung', n: 'Pulmões', c: '#93c5fd', on: true },
  { f: 'VH_M_Liver', n: 'Fígado', c: '#b45309', on: true },
  { f: 'VH_M_Kidney_L', n: 'Rim esquerdo', c: '#7c2d12', on: true },
  { f: 'VH_M_Kidney_R', n: 'Rim direito', c: '#7c2d12', on: true },
  { f: 'VH_M_Blood_Vasculature', n: 'Vasos sanguíneos', c: '#dc2626', on: false },
  { f: 'VH_M_Small_Intestine', n: 'Intestino delgado', c: '#f59e0b', on: true },
  { f: 'SBU_M_Intestine_Large', n: 'Intestino grosso', c: '#d97706', on: true },
  { f: 'VH_M_Pancreas', n: 'Pâncreas', c: '#fbbf24', on: false },
  { f: 'VH_M_Spleen', n: 'Baço', c: '#7f1d1d', on: false },
  { f: 'VH_M_Urinary_Bladder', n: 'Bexiga', c: '#facc15', on: false },
  { f: 'VH_M_Ureter_L', n: 'Ureter esquerdo', c: '#eab308', on: false },
  { f: 'VH_M_Ureter_R', n: 'Ureter direito', c: '#eab308', on: false },
  { f: 'VH_M_Prostate', n: 'Próstata', c: '#f472b6', on: false },
  { f: 'VH_M_Pelvis', n: 'Pelve (osso)', c: '#d6d3d1', on: false },
  { f: 'VH_M_Knee_L', n: 'Joelho esquerdo', c: '#d6d3d1', on: false },
  { f: 'VH_M_Knee_R', n: 'Joelho direito', c: '#d6d3d1', on: false },
  { f: 'VH_M_Eye_L', n: 'Olho esquerdo', c: '#e5e7eb', on: false },
  { f: 'VH_M_Eye_R', n: 'Olho direito', c: '#e5e7eb', on: false },
  { f: 'VH_M_Thymus', n: 'Timo', c: '#fda4af', on: false },
  { f: 'NIH_M_Lymph_Node', n: 'Linfonodos', c: '#86efac', on: false },
];

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#ffffff');
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight('#ffffff', '#d1d5db', 1.1));
const key = new THREE.DirectionalLight('#ffffff', 1.4); key.position.set(2, 3, 4); scene.add(key);
const fill = new THREE.DirectionalLight('#ffffff', 0.5); fill.position.set(-3, -1, -2); scene.add(fill);

const loader = new GLTFLoader();
const groups = new Map();
const tip = document.getElementById('tip');
let bbox = null;

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();

function frameAll() {
  const box = new THREE.Box3();
  let any = false;
  groups.forEach((g) => { if (g.visible) { box.expandByObject(g); any = true; } });
  if (!any) return;
  bbox = box;
  const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z) * 1.25;
  camera.position.set(center.x, center.y + size.y * 0.1, center.z + d);
  camera.near = d / 100; camera.far = d * 20; camera.updateProjectionMatrix();
  controls.target.copy(center); controls.update();
}

function apply(o, root) {
  root.traverse((m) => {
    if (!m.isMesh) return;
    m.material = new THREE.MeshStandardMaterial({ color: o.c, roughness: 0.6, metalness: 0.0, transparent: !!o.alpha, opacity: o.alpha ?? 1, depthWrite: !o.alpha });
    m.userData.organ = o; m.userData.base = m.material.color.clone();
  });
}

async function load(o) {
  if (groups.has(o.f)) { groups.get(o.f).visible = true; return; }
  o.status.textContent = '…';
  try {
    const gltf = await loader.loadAsync(BASE + o.f + '.glb');
    apply(o, gltf.scene);
    scene.add(gltf.scene); groups.set(o.f, gltf.scene);
    o.status.textContent = '';
    if (!bbox || o.f === 'VH_M_Skin') frameAll();
  } catch (e) { o.status.textContent = 'erro'; console.error(o.f, e); }
}

const list = document.getElementById('list');
for (const o of ORGANS) {
  const l = document.createElement('label'); l.className = 'o';
  l.innerHTML = `<input type="checkbox" ${o.on ? 'checked' : ''}><span class="sw" style="background:${o.c}"></span>${o.n}<span class="st"></span>`;
  o.status = l.querySelector('.st'); o.input = l.querySelector('input');
  o.input.addEventListener('change', () => { if (o.input.checked) load(o); else if (groups.has(o.f)) groups.get(o.f).visible = false; });
  list.appendChild(l);
}
document.getElementById('all').onclick = () => ORGANS.forEach(o => { o.input.checked = true; load(o); });
document.getElementById('none').onclick = () => ORGANS.forEach(o => { o.input.checked = false; if (groups.has(o.f)) groups.get(o.f).visible = false; });
document.getElementById('reset').onclick = () => { bbox = null; frameAll(); };

// seleção por clique
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let picked = null;
canvas.addEventListener('pointerdown', (e) => { canvas.dataset.x = e.clientX; canvas.dataset.y = e.clientY; });
canvas.addEventListener('pointerup', (e) => {
  if (Math.hypot(e.clientX - canvas.dataset.x, e.clientY - canvas.dataset.y) > 4) return;
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const vis = []; groups.forEach(g => { if (g.visible) vis.push(g); });
  const hits = ray.intersectObjects(vis, true).filter(h => !h.object.userData.organ?.alpha);
  if (picked) { picked.material.emissive.set('#000000'); picked = null; }
  if (hits.length) {
    picked = hits[0].object; picked.material.emissive.set('#333333');
    const o = picked.userData.organ;
    const raw = picked.name || picked.parent?.name || '';
    tip.innerHTML = `<b>${o.n}</b><small>${raw.replace(/_/g, ' ')}</small>`;
  } else tip.innerHTML = `<b>Clique em um órgão</b><small>arraste para girar, roda do mouse para aproximar</small>`;
});

Promise.all(ORGANS.filter(o => o.on).map(load)).then(frameAll);
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
</script>
</body>
</html>
